services:
  weaponsforge.claude-cli:
    container_name: weaponsforge-claude-cli
    image: weaponsforge/claude-cli:latest
    # Uncomment the following lines to use an environment file for configuration
    # env_file:
    #  - .env.local
    build:
      context: .
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./projects/hello:/opt/app/  # Replace "hello" with your project folder name
      - /opt/app/node_modules
    stdin_open: true
    tty: true
